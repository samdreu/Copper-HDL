# copper-analysis — shared compile-time control/liveness analysis (c2, gate G6).
#
# Deliberately LIGHT: depends only on copper-core (a leaf crate) and syn. This is
# what lets BOTH the copper-macros proc-macro and the copper-codegen transpiler
# depend on it with no dependency cycle and negligible extra compile cost — the
# feasibility question G6 exists to answer. The authoritative CFG / register
# inference / FSM report (item 2) will live here so the sim macro and the
# transpiler consume ONE analysis rather than two that must agree.
[package]
name = "copper-analysis"
version = "0.1.0"
edition = "2024"
description = "Copper shared compile-time control/liveness analysis over syn::ItemFn, consumed by both front-ends"
license = "MIT"
repository = "https://github.com/samdreu/Copper-HDL"
rust-version = "1.85"

[dependencies]
copper-core = { version = "0.1.0", path = "../copper-core" }
syn = { version = "2.0.114", features = ["full", "visit"] }
proc-macro2 = "1.0"

[dev-dependencies]
# `tests/front_end_parity.rs` pins SPEC II.1.3's fourth named exception (D-32): it reads the
# transpiler's lowered integer-method list (`copper_codegen::LOWERED_INT_METHODS`) from the code
# and transpiles a probe of every other integer method. A dev-dependency cycle is admitted by
# cargo; an integration test links the one `copper_analysis` both see.
copper-codegen = { path = "../copper-codegen" }
